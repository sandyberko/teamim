[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
eyre = { workspace = true }
axum = { version = "0.8.1", features = ["macros"] }
teamim = { path = "../.." }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.2", features = ["fs"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
