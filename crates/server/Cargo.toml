[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
eyre = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.8.1", features = ["macros", "tower-log", "multipart"] }
teamim = { path = "../.." }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
serde = { version = "1.0.217", features = ["derive"] }
open = "5.3.2"
bytes = "1.9.0"
mime = "0.3.17"
axum-serde = { version = "0.8.1", features = ["xml"] }

[dev-dependencies]
insta = "1.42.1"
quick-xml = { version = "0.37.2", features = ["serde"] }
