[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_setters = "0.1.8"
eyre.workspace = true
rfd = "0.15.4"
teamim = { version = "0.1.0", path = "../.." }
tokio = { version = "1.47.1", features = ["rt"] }

[dependencies.libcosmic]
# git = "https://github.com/pop-os/libcosmic.git"
path = "../../../libcosmic"
default-features = false
features = ["wgpu", "winit", "tokio"]

[lints]
workspace = true

[[test]]
name = "absolute"
path = "tests/absolute.rs"
# winit requires the main thread
harness = false
