<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>טעמים</title>

    <script src="build/index.js" type="module" async></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <fieldset>
            <legend>תמונה</legend>
            <input type="file" id="image-input" accept="image/*" title="בחר תמונה">
            <a id="save-image" download="טעמים.png" title="שמור תמונה">💾</a>
        </fieldset>
        <fieldset>
            <legend>קובץ זיהוי</legend>
            <input type="file" id="box-input" accept=".box" title="בחר קובץ זיהוי">
            <input id="save-box" type="submit" value="💾" title="שמור קובץ זיהוי">
        </fieldset>
        <fieldset>
            <legend>קובץ אימון</legend>
            <input id="training-input" type="file" multiple accept=".box,.jpg,.jpeg" title="בחר קובץ אימון">
            <input id="training-save" type="submit" value="💾" title="שמור קובץ אימון">
        </fieldset>
        <fieldset>
            <legend>זיהוי וציור</legend>
            <input id="recognize" type="submit" value="🔍" title="הרץ זיהוי">
            <input id="render-teamim" type="submit" value="✍️" title="צייר טעמים">
            <input id="diff" type="submit" value="📑" title="הראה הבדלים">
        </fieldset>
        <fieldset>
            <legend>תצוגה</legend>
            <button onclick="document.getElementById('legend').showModal()">מקרא</button>
        </fieldset>
    </header>
    <main id="main">
        <div id="box-container"></div>
    </main>
    <dialog id="legend">
        <header>
            <h2>מקרא</h2>
            <form method="dialog">
                <button type="submit">❌</button>
            </form>
        </header>
        <table>
            <thead>
                <tr>
                    <th id="keys" scope="col">מקשים</th>
                    <th id="action" scope="col">פעולה</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="rowgroup" headers="keys action" colspan="2">תצוגה</td>
                </tr>
                <tr>
                    <td><kbd>1</kbd></td>
                    <td>טקסט+ריבועים</td>
                </tr>
                <tr>
                    <td><kbd>2</kbd></td>
                    <td>תמונה</td>
                </tr>
                <tr>
                    <td><kbd>3</kbd></td>
                    <td>תמונה וריבועים</td>
                </tr>
                <tr>
                    <td><kbd>4</kbd></td>
                    <td>ריבוע נבחר</td>
                </tr>
            </tbody>
            <tbody>
                <tr>
                    <th scope="rowgroup" headers="keys action" colspan="2">זיהוי</th>
                </tr>
                <tr>
                    <td><kbd>F1</kbd></td>
                    <td>זיהוי שגיאות</td>
                </tr>
            </tbody>
            <tbody>
                <tr>
                    <th scope="rowgroup" headers="keys action" colspan="2">עריכה</td>
                </tr>
                <tr>
                    <td><kbd>Tab ⭾</kbd></td>
                    <td>ריבוע הבא</td>
                </tr>
                <tr>
                    <td><kbd>Shift</kbd>+<kbd>Tab ⭾</kbd></td>
                    <td>ריבוע קודם</td>
                </tr>
                <tr>
                    <td><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></td>
                    <td>הזז ריבוע</td>
                </tr>
                <tr>
                    <td><kbd>+ =</kbd></td>
                    <td>ריבוע חדש אחרי הנבחר</td>
                </tr>
                <tr>
                    <td><kbd>Delete</kbd></td>
                    <td>מחק ריבוע</td>
                </tr>
            </tbody>
        </table>
    </dialog>
</body>

</html>
